[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "northstar"
version = "0.1.0"
description = "NorthStar - travel planning assistant: per-destination RAG knowledge base + MCP tools"
requires-python = ">=3.12"

# Runtime dependencies are tracked in requirements.txt and added task by task,
# so the reason each package is present stays visible. This project is installed
# in editable mode only to make `app` importable from any working directory:
#     uv pip install -e .
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["app"]
